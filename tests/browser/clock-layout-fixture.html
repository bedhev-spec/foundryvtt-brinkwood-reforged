<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global clock rendered layout contract</title>
  <link rel="stylesheet" href="../../styles/blades.css">
  <style>
    body { margin: 0; padding: 24px; background: #f5f5f5; }
    #brinkwood-global-clock-overlay {
      --control-bg-color: rgb(32 43 54);
      --control-border-color: rgb(75 86 97);
      --control-icon-color: rgb(230 231 232);
      --ui-fade-opacity: 1;
      position: static;
      gap: 24px;
      overflow: visible;
    }
    .global-clock-list { max-height: none; }
    .global-clock-entry {
      --clock-max: 4;
      --clock-filled: 1;
      --clock-color: rgb(143 47 53);
      --clock-background: rgb(210 212 215);
    }
  </style>
</head>
<body>
  <main id="brinkwood-global-clock-overlay">
    <section class="global-clock-display top has-clocks" data-fixture="top" style="--vertical-offset: 0px">
      <div class="global-clock-list">
        <article class="global-clock-entry ui-control">
          <div class="global-clock__name"><span class="global-clock__label">Top clock</span><span class="global-clock__progress">1/4</span></div>
          <div class="global-clock__controls"><button type="button">H</button><button type="button">E</button><button type="button">D</button></div>
          <button type="button" class="global-clock__face" aria-label="Top clock: 1/4"></button>
        </article>
        <article class="global-clock-entry ui-control private">
          <div class="global-clock__name"><i class="fa-solid fa-eye-slash" aria-hidden="true"></i><span class="global-clock__visually-hidden">Private</span><span class="global-clock__label">A long hidden clock name that must truncate</span><span class="global-clock__progress">2/2</span></div>
          <div class="global-clock__controls"><button type="button">H</button><button type="button">E</button><button type="button">D</button></div>
          <button type="button" class="global-clock__face" aria-label="Long clock: 2/4"></button>
        </article>
      </div>
      <div class="global-clock__toolbar ui-control"><button type="button" class="global-clock__add" data-action="addClock" aria-label="Add clock"><i class="fa-solid fa-clock" aria-hidden="true"></i></button></div>
    </section>

    <section class="global-clock-display bottom has-clocks" data-fixture="bottom" style="--vertical-offset: 0px">
      <div class="global-clock-list">
        <article class="global-clock-entry ui-control">
          <div class="global-clock__name"><span class="global-clock__label">Bottom clock one</span><span class="global-clock__progress">3/4</span></div>
          <div class="global-clock__controls"><button type="button">H</button><button type="button">E</button><button type="button">D</button></div>
          <button type="button" class="global-clock__face" aria-label="Bottom clock one: 3/4"></button>
        </article>
        <article class="global-clock-entry ui-control">
          <div class="global-clock__name"><span class="global-clock__label">Bottom clock two</span><span class="global-clock__progress">4/4</span></div>
          <div class="global-clock__controls"><button type="button">H</button><button type="button">E</button><button type="button">D</button></div>
          <button type="button" class="global-clock__face" aria-label="Bottom clock two: 4/4"></button>
        </article>
      </div>
      <div class="global-clock__toolbar ui-control"><button type="button" class="global-clock__add" data-action="addClock" aria-label="Add clock"><i class="fa-solid fa-clock" aria-hidden="true"></i></button></div>
    </section>

    <section class="global-clock-display top" data-fixture="empty" style="--vertical-offset: 0px">
      <div class="global-clock__toolbar ui-control"><button type="button" class="global-clock__add" data-action="addClock" aria-label="Add clock on first load"><i class="fa-solid fa-clock" aria-hidden="true"></i></button></div>
    </section>
  </main>
  <output id="clock-layout-results" aria-live="polite">Running…</output>
  <script type="module" src="./clock-layout-fixture.mjs"></script>
</body>
</html>
