<aside id="mask-{{_id}}-attributes" class="mask-attributes mask-attribute-card sheet-attribute-presentation bw-ruled-card bw-ruled-card--trait-palette" aria-label="{{localize maskAttributesLabel}}">
  <div class="attributes-exp bw-ruled-card__title-band">
    <div class="stripe">
      <button type="button" class="attribute-label roll-die-attribute rollable-text"
        data-roll-attribute="{{system.type}}" data-roll-attribute-label="{{maskAttributesLabel}}"
        data-roll-value="{{system.mask_attributes.value}}">{{localize maskAttributesLabel}}</button>
    </div>
  </div>
  <div class="mask-attribute-card__body bw-ruled-card__body">
  {{#if system.mask_attributes.skills}}
  <div class="mask-attributes__skills">
    {{#each system.mask_attributes.skills as |skill skill_name|}}
    <div class="flex-horizontal">
      <div class="attributes-container mask-skill" role="group" aria-label="{{localize skill.label}}">
        {{#times_from_1 4}}
        <button type="button" class="dot-value {{#if (lt skill.value this)}}dot-value--empty{{else}}dot-value--filled{{/if}}" data-max_value="4" data-value="{{this}}" data-path="system.attributes.{{../../system.type}}.skills.{{skill_name}}.value" aria-label="{{localize skill.label}} {{this}} of 4" aria-pressed="{{#if (lt skill.value this)}}false{{else}}true{{/if}}"{{#unless ../../editable}} disabled{{/unless}}>{{#if (lt skill.value this)}}○{{else}}●{{/if}}</button>
        {{/times_from_1}}
      <button type="button" class="attribute-skill-label roll-die-attribute rollable-text tooltip" data-roll-attribute-label="{{skill.label}}" data-roll-value="{{skill.value}}" data-roll-attribute="{{skill_name}}" data-tooltip-html="{{skill.tooltipHtml}}" data-tooltip-class="brinkwood-item-tooltip-shell" data-tooltip-direction="RIGHT">{{localize skill.label}}</button>
      </div>
    </div>
    {{/each}}
  </div>
  {{else}}
  <p class="mask-attributes__empty">{{localize "BITD.Mask"}}</p>
  {{/if}}
  </div>
</aside>
